services:
  pm-recorder:
    build: .
    container_name: pm-recorder
    restart: unless-stopped
    network_mode: host          # simplest & lowest latency on a dedicated VM
    env_file: .env
    volumes:
      - ./data:/data
      - ./lut:/lut:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os,time,sys; p='/data/.heartbeat'; sys.exit(0) if time.time()-os.path.getmtime(p) < 180 else sys.exit(1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
